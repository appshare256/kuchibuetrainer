<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>精密周波数キーボード - 口笛練習用</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .key-element.active-key {
      background-color: #fbbf24 !important;
      color: #0f172a !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center select-none">

  <header class="text-center my-6">
    <h1 class="text-2xl font-bold text-amber-400 mb-1">🎯 精密周波数キーボード</h1>
    <p class="text-xs text-slate-400">口笛ピッチ練習＆12調対応フレーズシーケンサー (C4〜B8 全音域表示)</p>
  </header>

  <main class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">

    <!-- 基本コントロールエリア -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 bg-slate-850 p-4 rounded-xl border border-slate-750">
      
      <!-- 基準音設定 -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">基準 pitch (A4)</label>
        <div class="flex items-center space-x-2">
          <input type="number" id="basePitch" value="442.00" step="0.01" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-amber-300 font-mono text-sm text-right focus:outline-none focus:border-amber-400">
          <span class="text-xs text-slate-400">Hz</span>
        </div>
      </div>

      <!-- 波形（音色）選択 -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">音色 (波形)</label>
        <select id="waveType" class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-slate-200 text-sm focus:outline-none focus:border-amber-400">
          <option value="sine" selected>サイン波</option>
          <option value="triangle">三角波</option>
          <option value="square">矩形波</option>
          <option value="sawtooth">鋸波</option>
        </select>
      </div>

      <!-- 持続 (Hold) ボタン新設 -->
      <div class="flex flex-col justify-end">
        <label class="block text-xs font-medium text-slate-300 mb-1">演奏モード</label>
        <button id="sustainBtn" class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded px-3 py-2 text-slate-300 font-bold text-xs shadow flex items-center justify-center gap-1.5 transition-colors">
          <span>🔒 持続 (Hold): OFF</span>
        </button>
      </div>

    </div>

    <!-- 12調 練習パターン（プリセット）セクション -->
    <div class="mb-6 p-4 bg-slate-850 border border-amber-500/30 rounded-xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-700 pb-2 flex-wrap gap-2">
        <span class="text-xs font-bold text-amber-400 flex items-center gap-1">
          🎼 12調 練習パターン (Preset Sequencer)
        </span>
        
        <div class="flex items-center space-x-3">
          <!-- ループ再生 ON/OFF（デフォルトONに修正） -->
          <label class="flex items-center space-x-1 cursor-pointer text-xs text-slate-300">
            <input type="checkbox" id="presetLoopCheck" checked class="rounded bg-slate-900 border-slate-600 text-amber-500 focus:ring-amber-400">
            <span>🔄 ループ再生</span>
          </label>

          <!-- スピード選択 -->
          <div class="flex items-center space-x-1">
            <label class="text-[11px] text-slate-400">速度:</label>
            <button id="tempoSlowerBtn" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-amber-400 px-2 py-1 rounded text-xs font-bold shadow" title="速度を遅くする">
              ◀
            </button>
            <select id="tempoRate" class="bg-slate-900 border border-slate-600 text-slate-200 rounded text-xs px-2 py-1 focus:outline-none">
              <option value="4">0.25x</option>
              <option value="3.636364">0.275x</option>
              <option value="3.333333">0.3x</option>
              <option value="3.076923">0.325x</option>
              <option value="2.857143">0.35x</option>
              <option value="2.666667">0.375x</option>
              <option value="2.5">0.4x</option>
              <option value="2.352941">0.425x</option>
              <option value="2.222222">0.45x</option>
              <option value="2.105263">0.475x</option>
              <option value="2">0.5x</option>
              <option value="1.818182">0.55x</option>
              <option value="1.666667">0.6x</option>
              <option value="1.538462">0.65x</option>
              <option value="1.428571">0.7x</option>
              <option value="1.333333">0.75x</option>
              <option value="1.25">0.8x</option>
              <option value="1.176471">0.85x</option>
              <option value="1.111111">0.9x</option>
              <option value="1.052632">0.95x</option>
              <option value="1" selected>1x</option>
              <option value="0.909091">1.1x</option>
              <option value="0.833333">1.2x</option>
              <option value="0.769231">1.3x</option>
              <option value="0.714286">1.4x</option>
              <option value="0.666667">1.5x</option>
              <option value="0.625">1.6x</option>
              <option value="0.588235">1.7x</option>
              <option value="0.555556">1.8x</option>
              <option value="0.526316">1.9x</option>
              <option value="0.5">2x</option>
              <option value="0.454545">2.2x</option>
              <option value="0.416667">2.4x</option>
              <option value="0.384615">2.6x</option>
              <option value="0.357143">2.8x</option>
              <option value="0.333333">3x</option>
              <option value="0.3125">3.2x</option>
              <option value="0.294118">3.4x</option>
              <option value="0.277778">3.6x</option>
              <option value="0.263158">3.8x</option>
              <option value="0.25">4x</option>
            </select>
            <button id="tempoFasterBtn" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-amber-400 px-2 py-1 rounded text-xs font-bold shadow" title="速度を速くする">
              ▶
            </button>
          </div>
        </div>
      </div>

      <!-- 調（Key）＆ パターン選択コントロール -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- 主音（調）選択 -->
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">移調 (Transpose)</label>
          <div class="flex items-center space-x-1">
            <button id="keyDownBtn" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-amber-400 px-2.5 py-1.5 rounded text-xs font-bold shadow" title="音高を下げる">
              ▼
            </button>
            <select id="rootKeySelect" class="flex-1 bg-slate-900 border border-slate-600 text-amber-300 font-mono text-xs rounded px-2 py-1.5 focus:outline-none">
              <option value="-12">C (-12)</option>
              <option value="-11">C# (-11)</option>
              <option value="-10">D (-10)</option>
              <option value="-9">D# (-9)</option>
              <option value="-8">E (-8)</option>
              <option value="-7">F (-7)</option>
              <option value="-6">F# (-6)</option>
              <option value="-5">G (-5)</option>
              <option value="-4">G# (-4)</option>
              <option value="-3">A (-3)</option>
              <option value="-2">A# (-2)</option>
              <option value="-1">B (-1)</option>
              <option value="0" selected>C (±0)</option>
              <option value="1">C# (+1)</option>
              <option value="2">D (+2)</option>
              <option value="3">D# (+3)</option>
              <option value="4">E (+4)</option>
              <option value="5">F (+5)</option>
              <option value="6">F# (+6)</option>
              <option value="7">G (+7)</option>
              <option value="8">G# (+8)</option>
              <option value="9">A (+9)</option>
              <option value="10">A# (+10)</option>
              <option value="11">B (+11)</option>
              <option value="12">C (+12)</option>
            </select>
            <button id="keyUpBtn" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-amber-400 px-2.5 py-1.5 rounded text-xs font-bold shadow" title="音高を上げる">
              ▲
            </button>
          </div>
        </div>

        <!-- 練習フレーズ選択 -->
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">フレーズ</label>
          <div class="flex items-center space-x-1">
            <button id="patternPrevBtn" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-amber-400 px-2.5 py-1.5 rounded text-xs font-bold shadow" title="上の項目へ">
              ▲
            </button>
            <select id="patternPresetSelect" class="flex-1 bg-slate-900 border border-slate-600 text-slate-200 text-xs rounded px-2 py-1.5 focus:outline-none truncate">
              <option value="major_scale" selected>長音階</option>
              <option value="minor_scale_nat">自然短音階</option>
              <option value="minor_scale_harm">和声短音階</option>
              <option value="minor_scale_melo">旋律短音階</option>
              <option value="scale_8th_major">９度の音階 長調</option>
              <option value="scale_8th_minor">９度の音階 短調</option>
              <option value="triplet_major">３度の音階 長調</option>
              <option value="triplet_minor">３度の音階 短調</option>
              <option value="scale_16th_major">４度の音階 長調</option>
              <option value="scale_16th_minor">４度の音階 短調</option>
              <option value="interval_3rd">3度インターバル</option>
              <option value="interval_3rd_minor">短3度インターバル</option>
              <option value="interval_4th">4度インターバル</option>
              <option value="interval_5th">5度インターバル</option>
              <option value="leap_major">長調跳躍音階</option>
              <option value="leap_minor">短調跳躍音階</option>
              <option value="arpeggio_major_1">基本アルペジオ 長調1</option>
              <option value="arpeggio_major_2">基本アルペジオ 長調2</option>
              <option value="arpeggio_minor_1">基本アルペジオ 短調1</option>
              <option value="arpeggio_minor_2">基本アルペジオ 短調2</option>
              <option value="prelude">J.S.バッハ：プレリュード第1番（口笛用）</option>
              <option value="jesu_joy">J.S.バッハ：主よ、人の望みの喜びよ より</option>
              <option value="turkish_march">ベートーヴェン：トルコ行進曲より</option>
            </select>
            <button id="patternNextBtn" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-amber-400 px-2.5 py-1.5 rounded text-xs font-bold shadow" title="下の項目へ">
              ▼
            </button>
          </div>
        </div>
      </div>

      <!-- 再生位置スライダー ＆ A-Bリピート コントロールエリア -->
      <div class="pt-2 border-t border-slate-750/80 space-y-2">
        <div class="flex items-center justify-between text-[11px] text-slate-300 font-mono">
          <span id="presetProgressText" class="text-amber-300 font-bold">音符: 0 / 0</span>
          <span id="abStatusText" class="text-slate-400">A-B: 未設定</span>
        </div>

        <div class="relative flex items-center">
          <input type="range" id="presetProgressSlider" min="0" max="0" value="0" step="1" class="w-full h-2 bg-slate-900 rounded-lg appearance-none cursor-pointer accent-amber-400 focus:outline-none">
        </div>

        <!-- A-Bリピート ボタン群 -->
        <div class="grid grid-cols-4 gap-1.5 pt-1">
          <button id="setPointABtn" class="bg-slate-700 hover:bg-slate-650 active:bg-slate-600 text-amber-300 border border-slate-600 text-[11px] py-1 px-1.5 rounded font-semibold flex items-center justify-center gap-0.5 shadow transition-colors">
            📍 A設定
          </button>
          <button id="setPointBBtn" class="bg-slate-700 hover:bg-slate-650 active:bg-slate-600 text-amber-300 border border-slate-600 text-[11px] py-1 px-1.5 rounded font-semibold flex items-center justify-center gap-0.5 shadow transition-colors">
            📍 B設定
          </button>
          <button id="toggleABRepeatBtn" class="bg-slate-700 hover:bg-slate-650 active:bg-slate-600 text-slate-300 border border-slate-600 text-[11px] py-1 px-1.5 rounded font-semibold flex items-center justify-center gap-0.5 shadow transition-colors truncate">
            🔁 AB: OFF
          </button>
          <button id="clearABtn" class="bg-slate-750 hover:bg-slate-700 active:bg-slate-600 text-slate-400 border border-slate-650 text-[11px] py-1 px-1.5 rounded font-semibold flex items-center justify-center gap-0.5 shadow transition-colors">
            ✕ クリア
          </button>
        </div>
      </div>

      <div class="flex items-center space-x-2 pt-1">
        <button id="playPresetBtn" class="flex-1 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-bold py-2 rounded text-xs shadow flex items-center justify-center gap-1">
          ▶ プリセット再生
        </button>
        <button id="stopPresetBtn" disabled class="bg-slate-700 hover:bg-slate-600 text-slate-300 disabled:opacity-40 font-bold px-4 py-2 rounded text-xs shadow">
          ⏹ 停止
        </button>
      </div>
    </div>

    <!-- ユーザー自由録音＆リピート再生 -->
    <div class="mb-6 p-4 bg-slate-900 border border-slate-700 rounded-xl flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-2">
        <button id="recordBtn" class="bg-red-600 hover:bg-red-500 active:bg-red-700 text-white font-bold px-4 py-2 rounded text-xs flex items-center gap-1 shadow transition-colors">
          <span id="recDot" class="w-2.5 h-2.5 rounded-full bg-white inline-block"></span>
          <span id="recBtnText">自由録音</span>
        </button>
        <button id="playLoopBtn" disabled class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 disabled:bg-slate-700 disabled:text-slate-500 text-white font-bold px-4 py-2 rounded text-xs shadow transition-colors">
          🔄 録音再生
        </button>
        <button id="stopLoopBtn" disabled class="bg-slate-700 hover:bg-slate-600 text-slate-300 disabled:opacity-40 font-bold px-3 py-2 rounded text-xs shadow transition-colors">
          ⏹ 停止
        </button>
      </div>
      <div id="recStatus" class="text-xs font-mono text-slate-400">
        未録音
      </div>
    </div>

    <!-- 任意周波数の直接指定再生 -->
    <div class="mb-6 p-4 bg-amber-950/30 border border-amber-500/30 rounded-xl flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="text-xs text-amber-400 font-semibold">ピンポイント指定再生</div>
        <div class="text-xs text-slate-400">キーボード以外の自由な周波数を指定</div>
      </div>
      <div class="flex items-center space-x-2">
        <input type="number" id="customFreq" value="1046.50" step="0.01" class="w-32 bg-slate-900 border border-slate-600 rounded px-3 py-1.5 text-amber-300 font-mono text-sm text-right focus:outline-none focus:border-amber-400">
        <span class="text-xs text-slate-400">Hz</span>
        <button id="playCustomBtn" class="bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-bold px-4 py-1.5 rounded text-sm shadow">
          鳴らす
        </button>
      </div>
    </div>

    <!-- 5段縦並びキーボード表示部 -->
    <div id="keyboardWrapper" class="flex flex-col gap-2.5 my-4 p-2 sm:p-3 bg-slate-900 rounded-xl shadow-inner touch-none overflow-hidden">
      <!-- JavaScriptでオクターブ4〜8の5段を自動レンダリング -->
      <div id="keyboardContainer" class="flex flex-col gap-2.5 w-full"></div>
    </div>

    <!-- 現在再生中の情報 display -->
    <div class="mt-6 p-4 bg-slate-900 rounded-xl text-center border border-slate-750">
      <div class="text-xs text-slate-400 mb-1">発音中の正確な周波数・音名</div>
      <div class="flex items-center justify-center gap-3">
        <span id="currentNoteDisplay" class="text-2xl font-mono font-bold text-amber-300 bg-slate-800 px-3 py-0.5 rounded-lg border border-slate-700">---</span>
        <span id="currentFreqDisplay" class="text-3xl font-mono font-bold text-amber-400">---.-- <span class="text-base text-slate-500">Hz</span></span>
      </div>
    </div>

  </main>

  <footer class="mt-8 text-xs text-slate-500 text-center">
    GAS Web Application • Audio generated directly via Web Audio API Synthesizer
  </footer>

  <script>
    // --- 音響設定・状態管理 ---
    let audioCtx = null;
    let activeOscillator = null;
    let activeGainNode = null;
    const targetOctaves = [8, 7, 6, 5, 4]; // 高い鍵盤(Oct 8)を上、低い鍵盤(Oct 4)を下へ並べ替え
    let lastPlayedFreq = 0;
    
    let activeKeysStack = [];
    let isMouseDown = false;
    let isSustainEnabled = false; // 持続 (Hold) モード

    // シーケンサー管理
    let isRecording = false;
    let isLoopPlaying = false;
    let isPresetPlaying = false;
    let recordStartTime = 0;
    let recordedEvents = [];
    let loopTimeouts = [];
    let presetTimerId = null;
    let recordLoopTimerId = null;

    // A-B間リピート＆再生位置管理変数
    let currentPresetStep = 0;
    let pointA = null;
    let pointB = null;
    let isABRepeatEnabled = false;

    const noteDefinitions = [
      { name: 'C',  semitone: -9, isBlack: false },
      { name: 'C#', semitone: -8, isBlack: true },
      { name: 'D',  semitone: -7, isBlack: false },
      { name: 'D#', semitone: -6, isBlack: true },
      { name: 'E',  semitone: -5, isBlack: false },
      { name: 'F',  semitone: -4, isBlack: false },
      { name: 'F#', semitone: -3, isBlack: true },
      { name: 'G',  semitone: -2, isBlack: false },
      { name: 'G#', semitone: -1, isBlack: true },
      { name: 'A',  semitone: 0,  isBlack: false },
      { name: 'A#', semitone: 1,  isBlack: true },
      { name: 'B',  semitone: 2,  isBlack: false }
    ];

    const octaveColors = {
      4: { bg: '#fee2e2', border: '#fca5a5', text: '#991b1b', label: 'text-red-300', icon: '❶', badge: 'bg-red-950/80 border-red-500 text-red-300' },    // パステルレッド
      5: { bg: '#fef9c3', border: '#fde047', text: '#854d0e', label: 'text-yellow-300', icon: '❷', badge: 'bg-yellow-950/80 border-yellow-500 text-yellow-300' }, // パステルイエロー
      6: { bg: '#dcfce7', border: '#86efac', text: '#166534', label: 'text-emerald-300', icon: '❸', badge: 'bg-emerald-950/80 border-emerald-500 text-emerald-300' },// パステルグリーン
      7: { bg: '#dbeafe', border: '#93c5fd', text: '#1e40af', label: 'text-sky-300', icon: '❹', badge: 'bg-sky-950/80 border-sky-500 text-sky-300' },    // パステルブルー
      8: { bg: '#fce7f3', border: '#f472b6', text: '#831843', label: 'text-pink-300', icon: '❺', badge: 'bg-pink-950/80 border-pink-500 text-pink-300' }  // 色弱対応：パープルから明度差のあるピンク/マゼンタに変更
    };

    function initAudioEngine() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (!activeOscillator) {
        activeOscillator = audioCtx.createOscillator();
        activeGainNode = audioCtx.createGain();

        activeOscillator.type = document.getElementById('waveType').value;
        activeGainNode.gain.setValueAtTime(0, audioCtx.currentTime);

        activeOscillator.connect(activeGainNode);
        activeGainNode.connect(audioCtx.destination);
        activeOscillator.start();
      }
    }

    function calculateFrequency(semitoneOffset, octave) {
      const baseA4 = parseFloat(document.getElementById('basePitch').value) || 442;
      const totalSemitone = semitoneOffset + (octave - 4) * 12;
      return baseA4 * Math.pow(2, totalSemitone / 12);
    }

    function getNoteInfoFromFreq(freq) {
      if (!freq || freq <= 0) return '---';
      const baseA4 = parseFloat(document.getElementById('basePitch').value) || 442;
      const midi = Math.round(69 + 12 * Math.log2(freq / baseA4));
      const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      const noteName = noteNames[((midi % 12) + 12) % 12];
      const octave = Math.floor(midi / 12) - 1;
      return `${noteName}${octave}`;
    }

    function setAudioOutput(freq) {
      initAudioEngine();

      if (isRecording) {
        const elapsed = Date.now() - recordStartTime;
        recordedEvents.push({ time: elapsed, freq: freq });
      }

      const waveType = document.getElementById('waveType').value;
      activeOscillator.type = waveType;

      const noteDisplay = document.getElementById('currentNoteDisplay');
      const freqDisplay = document.getElementById('currentFreqDisplay');

      if (freq <= 0) {
        activeGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
        activeGainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.005);
        freqDisplay.innerHTML = `---.-- <span class="text-base text-slate-500">Hz</span>`;
        if (noteDisplay) noteDisplay.innerText = '---';
        lastPlayedFreq = 0;
      } else {
        const isSameNote = Math.abs(lastPlayedFreq - freq) < 0.05;
        if (isSameNote) {
          activeGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
          activeGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
          activeGainNode.gain.setTargetAtTime(0.2, audioCtx.currentTime + 0.015, 0.003);
        } else {
          activeGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
          activeGainNode.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.003);
        }

        activeOscillator.frequency.cancelScheduledValues(audioCtx.currentTime);
        activeOscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);

    function renderKeyboard() {
      const container = document.getElementById('keyboardContainer');
      if (!container) return;
      container.innerHTML = '';

      targetOctaves.forEach(octave => {
        const rowWrapper = document.createElement('div');
        rowWrapper.className = 'flex items-center bg-slate-850 p-1 rounded-lg border border-slate-750 w-full';

        const colorInfo = octaveColors[octave] || { bg: '#e2e8f0', border: '#cbd5e1', text: '#1e293b', label: 'text-amber-400', icon: '•', badge: 'bg-slate-800 border-slate-600 text-slate-300' };

        // 鍵盤キーボード本体のコンテナ（画面幅に合わせて100%伸縮）
        const keyboardRow = document.createElement('div');
        keyboardRow.className = 'flex relative w-full items-stretch h-20 sm:h-24 bg-slate-950 rounded-md overflow-hidden';

        noteDefinitions.forEach((note, index) => {
          const key = document.createElement('div');
          const keyId = `key-${octave}-${index}`;
          const freq = calculateFrequency(note.semitone, octave);

          key.dataset.keyId = keyId;
          key.dataset.freq = freq;

          let baseStyle = "key-element cursor-pointer flex flex-col justify-end items-center pb-1 transition-colors select-none ";
          if (note.isBlack) {
            // パーセンテージ幅(-mx-[4.25%] / w-[8.5%])で画面幅に応じて黒鍵位置を自動フィッティング
            baseStyle += "w-[8.5%] -mx-[4.25%] h-12 sm:h-14 bg-slate-950 border border-slate-700 rounded-b z-10 text-amber-400 font-mono text-[8px] sm:text-[9px] shadow-md leading-none";
            key.className = baseStyle;
          } else {
            baseStyle += "flex-1 h-20 sm:h-24 rounded-b font-mono text-[9px] sm:text-[11px] shadow-sm border leading-none";
            key.className = baseStyle;
            key.style.backgroundColor = colorInfo.bg;
            key.style.borderColor = colorInfo.border;
            key.style.color = colorInfo.text;
          }

          // 音名にオクターブ番号を付与（例: C8, C#8）
          const displayNoteName = `${note.name}${octave}`;
          key.innerHTML = `
            <span class="font-bold pointer-events-none mb-0.5">${displayNoteName}</span>
            <span class="text-[7px] sm:text-[8px] opacity-75 pointer-events-none font-mono">${Math.round(freq)}</span>
          `;

          key.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isMouseDown = true;
            if (isSustainEnabled) {
              const isAlreadyActive = activeKeysStack.some(k => k.id === keyId);
              if (isAlreadyActive && activeKeysStack.length === 1) {
                // 持続モード中、現在鳴っているキーを単体タップした場合は消音（トグルOFF）
                removeKey(keyId);
              } else {
                clearAllKeys();
                pushKey(keyId, freq);
              }
            } else {
              pushKey(keyId, freq);
            }
          });

          key.addEventListener('mouseenter', (e) => {
            if (isMouseDown) {
              if (isSustainEnabled) {
                // 持続モード中のグリッサンドドラッグ：移動先キーへ滑らかに切り替え
                clearAllKeys();
                pushKey(keyId, freq);
              } else {
                pushKey(keyId, freq);
              }
            }
          });

          key.addEventListener('mouseleave', (e) => {
            if (isMouseDown && !isSustainEnabled) {
              removeKey(keyId);
            }
          });

          keyboardRow.appendChild(key);
        });

        rowWrapper.appendChild(keyboardRow);
        container.appendChild(rowWrapper);
      });
    }

    window.addEventListener('mouseup', () => {
      if (isMouseDown) {
        isMouseDown = false;
        if (!isSustainEnabled) {
          clearAllKeys();
        }
      }
    });

    const keyboardWrapper = document.getElementById('keyboardWrapper');

    function updateTouchKeys(e) {
      e.preventDefault();
      let currentTouchKeyIds = [];

      for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const keyElem = target?.closest('.key-element');
        if (keyElem) {
          const keyId = keyElem.dataset.keyId;
          const freq = parseFloat(keyElem.dataset.freq);
          currentTouchKeyIds.push(keyId);

          if (isSustainEnabled) {
            // 持続モード時のタッチスワイプ：指が通過した先のキーへ次々更新
            if (!activeKeysStack.some(k => k.id === keyId)) {
              clearAllKeys();
              pushKey(keyId, freq);
            }
          } else {
            if (!activeKeysStack.some(k => k.id === keyId)) {
              pushKey(keyId, freq);
            }
          }
        }
      }

      if (!isSustainEnabled) {
        activeKeysStack.forEach(k => {
          if (!currentTouchKeyIds.includes(k.id) && k.id !== 'custom-freq-key') {
            removeKey(k.id);
          }
        });
      }
    }

    if (keyboardWrapper) {
      keyboardWrapper.addEventListener('touchstart', updateTouchKeys, { passive: false });
      keyboardWrapper.addEventListener('touchmove', updateTouchKeys, { passive: false });
      keyboardWrapper.addEventListener('touchend', updateTouchKeys, { passive: false });
      keyboardWrapper.addEventListener('touchcancel', updateTouchKeys, { passive: false });
    }

    function updateABStatusDisplay() {
      const statusText = document.getElementById('abStatusText');
      const toggleBtn = document.getElementById('toggleABRepeatBtn');
      if (!statusText || !toggleBtn) return;

      const aLabel = pointA !== null ? `A:${pointA + 1}` : 'A:未';
      const bLabel = pointB !== null ? `B:${pointB + 1}` : 'B:未';
      statusText.innerText = `[${aLabel} - ${bLabel}]`;

      if (isABRepeatEnabled) {
        toggleBtn.classList.remove('bg-slate-700', 'text-slate-300', 'border-slate-600');
        toggleBtn.classList.add('bg-amber-500', 'text-slate-950', 'border-amber-400');
        toggleBtn.innerText = '🔁 AB: ON';
      } else {
        toggleBtn.classList.remove('bg-amber-500', 'text-slate-950', 'border-amber-400');
        toggleBtn.classList.add('bg-slate-700', 'text-slate-300', 'border-slate-600');
        toggleBtn.innerText = '🔁 AB: OFF';
      }
    }

    function updateSliderUI(patternLength) {
      const slider = document.getElementById('presetProgressSlider');
      const progressText = document.getElementById('presetProgressText');
      if (!slider) return;

      slider.max = Math.max(0, patternLength - 1);
      slider.value = currentPresetStep;

      if (progressText) {
        progressText.innerText = `音符: ${patternLength > 0 ? currentPresetStep + 1 : 0} / ${patternLength}`;
      }
    }

    function playPresetSequence(startFromStep = null) {
      stopAllSequences();
      initAudioEngine();

      const patternSelect = document.getElementById('patternPresetSelect');
      const presetKey = patternSelect ? patternSelect.value : 'major_scale';
      const rawPattern = rawPresets[presetKey];

      if (!rawPattern || rawPattern.length === 0) return;

      isPresetPlaying = true;

      const playBtn = document.getElementById('playPresetBtn');
      const stopBtn = document.getElementById('stopPresetBtn');
      if (playBtn) playBtn.disabled = true;
      if (stopBtn) stopBtn.disabled = false;

      if (startFromStep !== null && startFromStep >= 0 && startFromStep < rawPattern.length) {
        currentPresetStep = startFromStep;
      } else if (isABRepeatEnabled && pointA !== null && pointA < rawPattern.length) {
        currentPresetStep = pointA;
      } else {
        currentPresetStep = 0;
      }

      function playNextStep() {
        if (!isPresetPlaying) return;

        // 速度・移調・ループ設定はここで毎回最新の値を読み込む（矢印連打やプルダウン変更が
        // 次の音符の頭出しタイミングにだけ反映され、音符を早送りしてしまうのを防ぐため）
        const rootSelect = document.getElementById('rootKeySelect');
        const tempoSelect = document.getElementById('tempoRate');
        const loopCheck = document.getElementById('presetLoopCheck');
        const rootShift = rootSelect ? (parseInt(rootSelect.value) || 0) : 0;
        const tempoMultiplier = tempoSelect ? (parseFloat(tempoSelect.value) || 1.0) : 1.0;
        const isLoop = loopCheck ? loopCheck.checked : false;

        // ABリピート判定
        const effectiveEnd = (isABRepeatEnabled && pointB !== null && pointB < rawPattern.length && pointB >= (pointA || 0)) 
          ? pointB 
          : rawPattern.length - 1;

        if (currentPresetStep > effectiveEnd || currentPresetStep >= rawPattern.length) {
          if (isABRepeatEnabled && pointA !== null && pointA < rawPattern.length) {
            currentPresetStep = pointA;
          } else if (isLoop) {
            currentPresetStep = 0;
          } else {
            stopPresetSequence();
            return;
          }
        }

        updateSliderUI(rawPattern.length);

        const item = rawPattern[currentPresetStep];
        const adjustedDuration = item.dur * tempoMultiplier;
        let freq = 0;

        if (!item.isRest && item.rel !== undefined && item.rel !== null) {
          const totalSemitoneOffset = item.rel + rootShift - 9; // -9: C4基準
          freq = calculateFrequency(totalSemitoneOffset, 6); // オクターブ6基準でスケール再生
        }

        setAudioOutput(freq);

        document.querySelectorAll('.key-element').forEach(el => {
          if (freq > 0 && Math.abs(parseFloat(el.dataset.freq) - freq) < 0.05) {
            el.classList.add('active-key');
          } else {
            el.classList.remove('active-key');
          }
        });

        currentPresetStep++;
        presetTimerId = setTimeout(playNextStep, adjustedDuration);
      }

      playNextStep();
    }

    function stopPresetSequence() {
      isPresetPlaying = false;
      if (presetTimerId) {
        clearTimeout(presetTimerId);
        presetTimerId = null;
      }
      loopTimeouts.forEach(clearTimeout);
      loopTimeouts = [];
      clearAllKeys();

      const playBtn = document.getElementById('playPresetBtn');
      const stopBtn = document.getElementById('stopPresetBtn');
      if (playBtn) playBtn.disabled = false;
      if (stopBtn) stopBtn.disabled = true;

      const patternSelect = document.getElementById('patternPresetSelect');
      const presetKey = patternSelect ? patternSelect.value : 'major_scale';
      const rawPattern = rawPresets[presetKey] || [];
      updateSliderUI(rawPattern.length);
    }

    function stopAllSequences() {
      if (isPresetPlaying) stopPresetSequence();
      if (isLoopPlaying) stopLoop();
    }

    // 移調変更時、演奏中のシーケンスを先送りせず「今鳴っている音」だけを
    // 新しい移調値でその場で鳴らし直す（速度は playNextStep 側で毎回最新値を読むので触らない）
    function updateCurrentNotePitchLive() {
      if (!isPresetPlaying) return;

      const patternSelect = document.getElementById('patternPresetSelect');
      const presetKey = patternSelect ? patternSelect.value : 'major_scale';
      const rawPattern = rawPresets[presetKey];
      if (!rawPattern) return;

      // currentPresetStep は直前に鳴らした音符の次を指しているため、-1 が「今鳴っている音符」
      const stepIndex = currentPresetStep - 1;
      if (stepIndex < 0 || stepIndex >= rawPattern.length) return;
      const item = rawPattern[stepIndex];
      if (!item) return;

      const rootSelect = document.getElementById('rootKeySelect');
      const rootShift = rootSelect ? (parseInt(rootSelect.value) || 0) : 0;

      let freq = 0;
      if (!item.isRest && item.rel !== undefined && item.rel !== null) {
        const totalSemitoneOffset = item.rel + rootShift - 9;
        freq = calculateFrequency(totalSemitoneOffset, 6);
      }

      setAudioOutput(freq);

      document.querySelectorAll('.key-element').forEach(el => {
        if (freq > 0 && Math.abs(parseFloat(el.dataset.freq) - freq) < 0.05) {
          el.classList.add('active-key');
        } else {
          el.classList.remove('active-key');
        }
      });
    }

    function safeAddListener(id, event, handler) {
      const elem = document.getElementById(id);
      if (elem) {
        elem.addEventListener(event, handler);
      }
    }

    safeAddListener('playPresetBtn', 'click', () => playPresetSequence());
    safeAddListener('stopPresetBtn', 'click', stopPresetSequence);

    // スライダー＆A-Bリピート イベントリスナー設定
    const sliderElem = document.getElementById('presetProgressSlider');
    if (sliderElem) {
      sliderElem.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        currentPresetStep = val;
        const patternSelect = document.getElementById('patternPresetSelect');
        const presetKey = patternSelect ? patternSelect.value : 'major_scale';
        const rawPattern = rawPresets[presetKey] || [];
        updateSliderUI(rawPattern.length);

        if (isPresetPlaying) {
          playPresetSequence(val);
        }
      });
    }

    safeAddListener('setPointABtn', 'click', () => {
      pointA = Math.max(0, currentPresetStep > 0 && isPresetPlaying ? currentPresetStep - 1 : currentPresetStep);
      if (pointB !== null && pointB < pointA) {
        pointB = null;
      }
      updateABStatusDisplay();
    });

    safeAddListener('setPointBBtn', 'click', () => {
      pointB = Math.max(0, currentPresetStep > 0 && isPresetPlaying ? currentPresetStep - 1 : currentPresetStep);
      if (pointA !== null && pointA > pointB) {
        pointA = pointB;
      }
      updateABStatusDisplay();
    });

    safeAddListener('toggleABRepeatBtn', 'click', () => {
      isABRepeatEnabled = !isABRepeatEnabled;
      updateABStatusDisplay();
      if (isABRepeatEnabled && isPresetPlaying) {
        playPresetSequence(currentPresetStep);
      }
    });

    safeAddListener('clearABtn', 'click', () => {
      pointA = null;
      pointB = null;
      isABRepeatEnabled = false;
      updateABStatusDisplay();
    });

    safeAddListener('patternPresetSelect', 'change', () => {
      currentPresetStep = 0;
      pointA = null;
      pointB = null;
      updateABStatusDisplay();
      const patternSelect = document.getElementById('patternPresetSelect');
      const presetKey = patternSelect ? patternSelect.value : 'major_scale';
      const rawPattern = rawPresets[presetKey] || [];
      updateSliderUI(rawPattern.length);

      if (isPresetPlaying) {
        playPresetSequence(0);
      }
    });

    // 録音機能関連
    const playLoopBtn = document.getElementById('playLoopBtn');
    const stopLoopBtn = document.getElementById('stopLoopBtn');
    const recStatus = document.getElementById('recStatus');
    const recDot = document.getElementById('recDot');
    const recBtnText = document.getElementById('recBtnText');

    safeAddListener('recordBtn', 'click', () => {
      stopAllSequences();

      if (!isRecording) {
        isRecording = true;
        recordedEvents = [];
        recordStartTime = Date.now();
        if (recDot) recDot.classList.add('animate-ping');
        if (recBtnText) recBtnText.innerText = '録音停止';
        if (recStatus) recStatus.innerText = '🔴 録音中...';
        if (playLoopBtn) playLoopBtn.disabled = true;
        if (stopLoopBtn) stopLoopBtn.disabled = true;
      } else {
        isRecording = false;
        if (recDot) recDot.classList.remove('animate-ping');
        if (recBtnText) recBtnText.innerText = '自由録音';
        
        const totalDuration = ((Date.now() - recordStartTime) / 1000).toFixed(1);
        recordedEvents.push({ time: Date.now() - recordStartTime, freq: 0 });

        if (recordedEvents.length > 1) {
          if (recStatus) recStatus.innerText = `録音完了 (${totalDuration}秒)`;
          if (playLoopBtn) playLoopBtn.disabled = false;
        } else {
          if (recStatus) recStatus.innerText = '録音データなし';
        }
      }
    });

    function startLoop() {
      if (recordedEvents.length === 0) return;
      stopAllSequences();
      initAudioEngine();
      isLoopPlaying = true;
      if (playLoopBtn) playLoopBtn.disabled = true;
      if (stopLoopBtn) stopLoopBtn.disabled = false;
      if (recStatus) recStatus.innerText = '🔄 録音再生中...';

      let eventIndex = 0;

      function playNextRecordedEvent() {
        if (!isLoopPlaying) return;

        if (eventIndex >= recordedEvents.length) {
          eventIndex = 0;
        }

        const currentEvt = recordedEvents[eventIndex];
        setAudioOutput(currentEvt.freq);

        document.querySelectorAll('.key-element').forEach(el => {
          if (currentEvt.freq > 0 && Math.abs(parseFloat(el.dataset.freq) - currentEvt.freq) < 0.05) {
            el.classList.add('active-key');
          } else {
            el.classList.remove('active-key');
          }
        });

        const nextIndex = (eventIndex + 1) % recordedEvents.length;
        let delay = 0;
        if (nextIndex === 0) {
          delay = 200;
        } else {
          delay = recordedEvents[nextIndex].time - currentEvt.time;
        }
        if (delay < 10) delay = 10;

        eventIndex = nextIndex;
        recordLoopTimerId = setTimeout(playNextRecordedEvent, delay);
      }

      playNextRecordedEvent();
    }

    function stopLoop() {
      isLoopPlaying = false;
      if (recordLoopTimerId) {
        clearTimeout(recordLoopTimerId);
        recordLoopTimerId = null;
      }
      loopTimeouts.forEach(clearTimeout);
      loopTimeouts = [];
      clearAllKeys();
      if (playLoopBtn) playLoopBtn.disabled = false;
      if (stopLoopBtn) stopLoopBtn.disabled = true;
      if (recStatus) recStatus.innerText = '再生停止';
    }

    safeAddListener('playLoopBtn', 'click', startLoop);
    safeAddListener('stopLoopBtn', 'click', stopLoop);

    // 主音（Root Key）矢印ボタン
    safeAddListener('keyUpBtn', 'click', () => {
      const rootSelect = document.getElementById('rootKeySelect');
      if (!rootSelect) return;
      let val = parseInt(rootSelect.value);
      if (val < 12) {
        val++;
        rootSelect.value = val;
        updateCurrentNotePitchLive();
      }
    });

    safeAddListener('keyDownBtn', 'click', () => {
      const rootSelect = document.getElementById('rootKeySelect');
      if (!rootSelect) return;
      let val = parseInt(rootSelect.value);
      if (val > -12) {
        val--;
        rootSelect.value = val;
        updateCurrentNotePitchLive();
      }
    });

    // 移調プルダウン直接選択
    safeAddListener('rootKeySelect', 'change', () => {
      updateCurrentNotePitchLive();
    });

    // フレーズ（Pattern）矢印ボタン
    safeAddListener('patternPrevBtn', 'click', () => {
      const patternSelect = document.getElementById('patternPresetSelect');
      if (patternSelect && patternSelect.options.length > 0) {
        if (patternSelect.selectedIndex > 0) {
          patternSelect.selectedIndex--;
        } else {
          patternSelect.selectedIndex = patternSelect.options.length - 1;
        }
        if (isPresetPlaying) playPresetSequence();
      }
    });

    safeAddListener('patternNextBtn', 'click', () => {
      const patternSelect = document.getElementById('patternPresetSelect');
      if (patternSelect && patternSelect.options.length > 0) {
        if (patternSelect.selectedIndex < patternSelect.options.length - 1) {
          patternSelect.selectedIndex++;
        } else {
          patternSelect.selectedIndex = 0;
        }
        if (isPresetPlaying) playPresetSequence();
      }
    });

    // 速度（Tempo）矢印ボタン
    safeAddListener('tempoSlowerBtn', 'click', () => {
      const tempoSelect = document.getElementById('tempoRate');
      if (tempoSelect && tempoSelect.options.length > 0 && tempoSelect.selectedIndex > 0) {
        tempoSelect.selectedIndex--;
      }
    });

    safeAddListener('tempoFasterBtn', 'click', () => {
      const tempoSelect = document.getElementById('tempoRate');
      if (tempoSelect && tempoSelect.options.length > 0 && tempoSelect.selectedIndex < tempoSelect.options.length - 1) {
        tempoSelect.selectedIndex++;
      }
    });

    safeAddListener('basePitch', 'input', () => {
      clearAllKeys();
      renderKeyboard();
    });

    // 持続 (Hold) ボタンの制御
    safeAddListener('sustainBtn', 'click', () => {
      isSustainEnabled = !isSustainEnabled;
      const sustainBtn = document.getElementById('sustainBtn');
      if (sustainBtn) {
        if (isSustainEnabled) {
          sustainBtn.classList.remove('bg-slate-700', 'text-slate-300', 'hover:bg-slate-600');
          sustainBtn.classList.add('bg-amber-500', 'text-slate-950', 'hover:bg-amber-400', 'border-amber-400');
          sustainBtn.innerHTML = '<span>🔓 持続 (Hold): ON</span>';
        } else {
          sustainBtn.classList.remove('bg-amber-500', 'text-slate-950', 'hover:bg-amber-400', 'border-amber-400');
          sustainBtn.classList.add('bg-slate-700', 'text-slate-300', 'hover:bg-slate-600');
          sustainBtn.innerHTML = '<span>🔒 持続 (Hold): OFF</span>';
          clearAllKeys();
        }
      }
    });

    // 任意周波数再生ボタン
    const customBtn = document.getElementById('playCustomBtn');
    const customKeyId = 'custom-freq-key';

    const playCustomTone = (e) => {
      e.preventDefault();
      const customFreqInput = document.getElementById('customFreq');
      if (customFreqInput) {
        const freq = parseFloat(customFreqInput.value);
        if (freq && freq > 0) {
          pushKey(customKeyId, freq);
        }
      }
    };
    
    const stopCustomTone = (e) => {
      e.preventDefault();
      removeKey(customKeyId);
    };

    if (customBtn) {
      customBtn.addEventListener('mousedown', playCustomTone);
      customBtn.addEventListener('mouseup', stopCustomTone);
      customBtn.addEventListener('mouseleave', stopCustomTone);
      customBtn.addEventListener('touchstart', playCustomTone, { passive: false });
      customBtn.addEventListener('touchend', stopCustomTone, { passive: false });
    }

    // 初期化実行
    renderKeyboard();
    const initPatternSelect = document.getElementById('patternPresetSelect');
    if (initPatternSelect) {
      const initPattern = rawPresets[initPatternSelect.value] || [];
      updateSliderUI(initPattern.length);
    }
    updateABStatusDisplay();
  </script>
</body>
</html>
